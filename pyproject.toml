[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "links-analyzer"
version = "0.1.0"
description = "An asynchronous website analyzer built on FastAPI using aiohttp and Celery."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [
    { name = "Nikolay Petukhov (NikPACodes)" }
]
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.51,<0.52",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "python-dotenv>=1.2,<2.0",

    # Работа с БД.
    "asyncpg>=0.31,<0.32",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.18,<2.0",

    # Загрузчик и парсер URLs.
    "aiohttp>=3.14,<4.0",
    "lxml>=6.1,<7.0",
    "beautifulsoup4>=4.15,<5.0",

    # Фоновые задачи.
    "celery[redis]>=5.5,<6.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "httpx>=0.28,<0.29",
  "mypy>=2.3,<3.0",
  "ruff>=0.16,<1.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["app"]
# Автоматическая обработка async-тестов.
asyncio_mode = "auto"


[tool.ruff]
target-version = "py312"
line-length = 120
# Исключаем из проверки файлы миграций.
extend-exclude = [
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # Базовые нарушения стиля pycodestyle.
    "F",   # Ошибки Pyflakes: неиспользуемые импорты, неизвестные имена и другие проблемы.
    "I",   # Проверка и сортировка импортов.
    "B",   # Потенциальные ошибки из flake8-bugbear.
    "UP",  # Рекомендации по использованию современного Python-синтаксиса.
    "N",   # Соглашения об именовании из pep8-naming.
]

[tool.ruff.lint.per-file-ignores]
# Игнорируем ошибку N999 для файлов __init__.py
"__init__.py" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
# Настрока для FastAPI. Игнорирование ошибки B008 для конструкции Depends(...).
extend-immutable-calls = [
    "fastapi.Depends",
]


[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true     # Проверять тела функций, даже если часть аргументов не типизирована.
warn_unused_ignores = true    # Сообщать о комментариях type: ignore, которые больше не нужны.
warn_redundant_casts = true   # Сообщать о лишних и бессмысленных приведениях типов.
no_implicit_optional = true   # Запретить неявное добавление None к типу аргумента.