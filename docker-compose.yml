services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: links_analyzer_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: links_analyzer_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - links_analyzer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: links_analyzer_redis
    ports:
      - "6379:6379"
    volumes:
      - links_analyzer_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  links_analyzer_pg_data:
  links_analyzer_redis_data:
